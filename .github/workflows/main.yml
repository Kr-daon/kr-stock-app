
name: Daily KRX Update

on:
  schedule:
    - cron: '40 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/557259544669/locations/global/workloadIdentityPools/github-actions-pool/providers/github'
          service_account: 'kr-stock-updater@kr-stock-signal.iam.gserviceaccount.com'

      - name: Generate stock analysis
        run: python update.py

      - name: Upload analysis to Firestore
        run: python upload_firestore.py

      - name: Verify completion
        run: echo "KRX analysis update completed"
